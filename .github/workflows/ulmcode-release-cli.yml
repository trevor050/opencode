name: ulmcode-release-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.1.64)"
        required: true
        type: string
      draft:
        description: "Create/update as a draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "[ok] release exists: $TAG"
            exit 0
          fi
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then FLAGS+=("--draft"); fi
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=("--prerelease"); fi
          gh release create "$TAG" --repo "$REPO" --title "ULMCode $TAG" --notes "ULMCode CLI release $TAG." "${FLAGS[@]}"

  upload_skills:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Build skills bundle
        run: |
          ./tools/ulmcode-profile/scripts/build-skills-bundle.sh ./dist

      - name: Upload skills bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" ./dist/ulmcode-skills.tar.gz --repo "$REPO" --clobber

  release_capabilities:
    needs: create_release
    runs-on: ubuntu-latest
    outputs:
      apple_signing: ${{ steps.apple-signing.outputs.available }}
    steps:
      - id: apple-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE}" ] &&
             [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] &&
             [ -n "${APPLE_API_KEY_PATH}" ] &&
             [ -n "${APPLE_API_KEY}" ] &&
             [ -n "${APPLE_API_ISSUER}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping macOS desktop packaging because Apple signing secrets are not fully configured"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build_cli:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + upload CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: "1"
        run: |
          ./packages/opencode/script/build.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ulmcode-cli-assets
          path: packages/opencode/dist/*

  publish_homebrew_tap:
    needs: build_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v4
        with:
          name: ulmcode-cli-assets
          path: /tmp/ulmcode-cli-assets

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::notice::Skipping Homebrew tap publish because HOMEBREW_TAP_TOKEN is not configured"
            exit 0
          fi

          cd /tmp/ulmcode-cli-assets
          export HOMEBREW_DARWIN_ARM64_SHA256="$(sha256sum opencode-darwin-arm64.zip | awk '{print $1}')"
          export HOMEBREW_DARWIN_X64_SHA256="$(sha256sum opencode-darwin-x64-baseline.zip | awk '{print $1}')"
          export HOMEBREW_LINUX_ARM64_SHA256="$(sha256sum opencode-linux-arm64.tar.gz | awk '{print $1}')"
          export HOMEBREW_LINUX_X64_SHA256="$(sha256sum opencode-linux-x64-baseline.tar.gz | awk '{print $1}')"

          cd "$GITHUB_WORKSPACE"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/trevor050/homebrew-ulmcode.git" /tmp/homebrew-ulmcode
          mkdir -p /tmp/homebrew-ulmcode/Formula
          bun packages/opencode/script/homebrew-formula.ts > /tmp/homebrew-ulmcode/Formula/ulmcode.rb

          git -C /tmp/homebrew-ulmcode config user.name "github-actions[bot]"
          git -C /tmp/homebrew-ulmcode config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/homebrew-ulmcode add Formula/ulmcode.rb
          if git -C /tmp/homebrew-ulmcode diff --cached --quiet; then
            echo "[ok] Homebrew formula already up to date"
            exit 0
          fi
          git -C /tmp/homebrew-ulmcode commit -m "ulmcode ${OPENCODE_VERSION}"
          git -C /tmp/homebrew-ulmcode push

  build_desktop:
    needs:
      - create_release
      - build_cli
      - release_capabilities
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
            requires_apple_signing: true
          - host: macos-14
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
            requires_apple_signing: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win --x64
            requires_apple_signing: false
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux --x64
            requires_apple_signing: false
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Skip macOS desktop packaging without signing secrets
        if: ${{ matrix.settings.requires_apple_signing && needs.release_capabilities.outputs.apple_signing != 'true' }}
        run: echo "::notice::Skipping ${{ matrix.settings.target }} because Apple signing secrets are not fully configured"

      - uses: apple-actions/import-codesign-certs@v2
        if: ${{ runner.os == 'macOS' && needs.release_capabilities.outputs.apple_signing == 'true' }}
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: ${{ runner.os == 'macOS' && needs.release_capabilities.outputs.apple_signing == 'true' }}
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > "$RUNNER_TEMP/apple-api-key.p8"

      - uses: ./.github/actions/setup-bun
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - uses: actions/setup-node@v4
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        with:
          node-version: "24"

      - name: Install Linux packaging dependencies
        if: ${{ runner.os == 'Linux' && (!matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare desktop bundle
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.settings.target }}
        run: bun ./scripts/prepare.ts

      - name: Build desktop renderer/main
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: bun run build

      - name: Package desktop updater artifacts
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_CHANNEL: prod
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts

      - name: Create macOS app archive
        if: ${{ runner.os == 'macOS' && needs.release_capabilities.outputs.apple_signing == 'true' }}
        working-directory: packages/desktop/dist
        shell: bash
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="ulmcode-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="ulmcode-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload desktop release assets
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            gh release upload "v${VERSION}" "$file" --repo "$REPO" --clobber
          done < <(find packages/desktop/dist -maxdepth 1 -type f ! -name 'builder-debug.yml' -print0)

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (!matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true') }}
        with:
          name: ulmcode-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.settings.requires_apple_signing || needs.release_capabilities.outputs.apple_signing == 'true' }}
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  finalize_desktop_updates:
    needs: build_desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Merge and upload updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ inputs.version }}
          LATEST_YML_DIR: /tmp/latest-yml
        run: bun packages/desktop/scripts/finalize-latest-yml.ts
